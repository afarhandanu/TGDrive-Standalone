plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

def versionProps = new Properties()
file('../version.properties').withInputStream { versionProps.load(it) }
def signingVars = ['TGDRIVE_KEYSTORE_PATH','TGDRIVE_KEYSTORE_PASSWORD','TGDRIVE_KEY_ALIAS','TGDRIVE_KEY_PASSWORD']
def signed = signingVars.every { System.getenv(it) }

android {
    namespace 'com.tgdrive.mobile'
    compileSdk 36
    defaultConfig {
        applicationId 'com.tgdrive.mobile'
        minSdk 29
        targetSdk 35
        versionCode versionProps.getProperty('VERSION_CODE').toInteger()
        versionName versionProps.getProperty('VERSION_NAME')
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }
    signingConfigs {
        if (signed) {
            release {
                storeFile file(System.getenv('TGDRIVE_KEYSTORE_PATH'))
                storePassword System.getenv('TGDRIVE_KEYSTORE_PASSWORD')
                keyAlias System.getenv('TGDRIVE_KEY_ALIAS')
                keyPassword System.getenv('TGDRIVE_KEY_PASSWORD')
                enableV1Signing true
                enableV2Signing true
            }
        }
    }
    buildTypes {
        debug { applicationIdSuffix '.debug'; versionNameSuffix '-debug' }
        release {
            if (signed) signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

chaquopy {
    defaultConfig {
        version '3.11'
        pip {
            install 'yt-dlp==2026.8.19'
            install 'gallery-dl==1.32.13'
            install 'tzdata'
        }
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-auth:22.0.0'
    implementation 'androidx.activity:activity:1.13.0'
    implementation 'dev.ffmpegkit-maintained:ffmpeg-kit-min:8.1.7'
    implementation 'org.libtorrent4j:libtorrent4j-android-arm64:2.1.0-39'
    implementation 'org.libtorrent4j:libtorrent4j-android-x86_64:2.1.0-39'
}

// Bundle both complete translations for offline Info pages.
def generatedAppDocs = layout.buildDirectory.dir('generated/appDocs')
def syncAppDocs = tasks.register('syncAppDocs', Sync) {
    from(rootProject.file('docs/i18n')) { into 'info' }
    into generatedAppDocs
}
android.sourceSets.main.assets.srcDir(generatedAppDocs)
tasks.named('preBuild').configure { dependsOn(syncAppDocs) }
